<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Alarm</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1 class="title">⏰ Simple Alarm</h1>

    <div class="clock" id="clock">--:--:--</div>

    <form class="setter" id="alarm-form">
      <input type="time" id="alarm-time" required />
      <button type="submit" class="btn btn-primary">セット</button>
    </form>

    <ul class="alarm-list" id="alarm-list"></ul>
  </main>

  <div class="overlay hidden" id="overlay">
    <div class="ringing">
      <div class="ringing-icon">⏰</div>
      <p class="ringing-text">時間ですわ！</p>
      <button class="btn btn-stop" id="stop-btn">止める</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
